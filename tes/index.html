<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Untuk Kamu ❤️</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #07050a;
            font-family: Arial, sans-serif;
        }

        /* =========================
           HALAMAN LOADING
        ========================= */

        .loading {
            position: fixed;
            width: 100%;
            height: 100vh;

            background: #07050a;

            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 100;

            transition: 1.5s;
        }

        .loading.hilang {
            opacity: 0;
            pointer-events: none;
        }

        .loading-box {
            text-align: center;
        }

        /* HATI */

        .hati {
            width: 35px;
            height: 35px;

            background: #ff3f91;

            margin: auto;
            margin-bottom: 30px;

            transform: rotate(45deg);

            position: relative;

            box-shadow:
                0 0 10px #ff3f91,
                0 0 25px #ff3f91,
                0 0 45px #ff3f91;

            animation: detak 1s infinite;
        }

        .hati::before,
        .hati::after {
            content: "";

            width: 35px;
            height: 35px;

            background: #ff3f91;

            border-radius: 50%;

            position: absolute;
        }

        .hati::before {
            left: -17px;
            top: 0;
        }

        .hati::after {
            left: 0;
            top: -17px;
        }

        @keyframes detak {

            0% {
                transform: rotate(45deg) scale(1);
            }

            50% {
                transform: rotate(45deg) scale(1.2);
            }

            100% {
                transform: rotate(45deg) scale(1);
            }

        }

        .loading-text {
            color: #b97996;

            font-size: 12px;

            letter-spacing: 5px;
        }

        .garis {
            width: 100px;
            height: 1px;

            background: #a86b86;

            margin: 18px auto;
        }


        /* =========================
           HALAMAN UTAMA
        ========================= */

        .utama {
            width: 100%;
            height: 100vh;

            position: relative;

            opacity: 0;

            transition: 2s;

            background:
                radial-gradient(
                    circle at center,
                    rgba(100, 0, 50, 0.20),
                    transparent 60%
                ),
                #07050a;
        }

        .utama.muncul {
            opacity: 1;
        }


        /* =========================
           FOTO KECIL
        ========================= */

        .foto {
            position: absolute;

            width: 90px;
            height: 90px;

            object-fit: cover;

            border-radius: 18px;

            box-shadow:
                0 0 10px rgba(255, 70, 145, 0.4),
                0 0 25px rgba(255, 70, 145, 0.15);

            animation: melayang 5s ease-in-out infinite;

            z-index: 5;
        }


        /* FOTO 1 */

        .foto1 {
            top: 6%;
            right: 7%;
        }


        /* FOTO 2 */

        .foto2 {
            top: 43%;
            left: 7%;

            animation-delay: 1s;
        }


        /* FOTO 3 */

        .foto3 {
            bottom: 7%;
            right: 7%;

            animation-delay: 2s;
        }


        @keyframes melayang {

            0% {
                transform: translateY(0px) rotate(0deg);
            }

            50% {
                transform: translateY(-12px) rotate(2deg);
            }

            100% {
                transform: translateY(0px) rotate(0deg);
            }

        }


        /* =========================
           FOTO BESAR TENGAH
        ========================= */

        .foto-tengah {

            position: absolute;

            width: 210px;
            height: 270px;

            object-fit: cover;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            border-radius: 25px;

            border: 1px solid rgba(255, 100, 160, 0.4);

            box-shadow:

                0 0 15px rgba(255, 50, 130, 0.5),

                0 0 35px rgba(255, 50, 130, 0.3),

                0 0 70px rgba(255, 50, 130, 0.15);

            animation: tengah 5s ease-in-out infinite;

            z-index: 4;
        }


        @keyframes tengah {

            0% {

                transform:
                    translate(-50%, -50%)
                    scale(1);

            }

            50% {

                transform:
                    translate(-50%, -50%)
                    scale(1.04);

            }

            100% {

                transform:
                    translate(-50%, -50%)
                    scale(1);

            }

        }


        /* =========================
           TEKS
        ========================= */

        .teks {

            position: absolute;

            white-space: nowrap;

            font-weight: 300;

            text-shadow:
                0 0 8px currentColor,
                0 0 15px currentColor;

            animation:
                bergerak 7s ease-in-out infinite;

            opacity: 0.6;
        }


        @keyframes bergerak {

            0% {
                transform: translateX(-15px);
            }

            50% {
                transform: translateX(15px);
            }

            100% {
                transform: translateX(-15px);
            }

        }


        .teks1 {

            top: 12%;
            left: 6%;

            color: #ff5c9d;

            font-size: 20px;
        }


        .teks2 {

            top: 20%;
            right: 2%;

            color: #ff80ad;

            font-size: 27px;

            animation-delay: 1s;
        }


        .teks3 {

            top: 31%;
            left: 12%;

            color: #a84a77;

            font-size: 16px;

            animation-delay: 2s;
        }


        .teks4 {

            top: 40%;
            right: 3%;

            color: #ed5c99;

            font-size: 22px;

            animation-delay: 1s;
        }


        .teks5 {

            top: 62%;
            left: 3%;

            color: #ff4c91;

            font-size: 19px;
        }


        .teks6 {

            top: 70%;
            right: 5%;

            color: #39cbd0;

            font-size: 24px;

            animation-delay: 2s;
        }


        .teks7 {

            bottom: 13%;
            left: 5%;

            color: #fa397e;

            font-size: 21px;

            animation-delay: 1s;
        }


        .teks8 {

            bottom: 4%;
            right: 4%;

            color: #34c5ca;

            font-size: 20px;
        }


        /* =========================
           PARTIKEL
        ========================= */

        .partikel {

            position: absolute;

            width: 3px;
            height: 3px;

            border-radius: 50%;

            background: #ff4b96;

            box-shadow:
                0 0 8px #ff4b96;

            animation: naik 7s linear infinite;
        }


        @keyframes naik {

            0% {

                transform:
                    translateY(110vh);

                opacity: 0;

            }

            20% {

                opacity: 0.8;

            }

            100% {

                transform:
                    translateY(-10vh);

                opacity: 0;

            }

        }


        /* =========================
           HP
        ========================= */

        @media (max-width: 600px) {

            .foto {

                width: 75px;
                height: 75px;

                border-radius: 15px;
            }


            .foto-tengah {

                width: 180px;
                height: 235px;

                border-radius: 22px;
            }


            .teks2 {

                font-size: 23px;

            }


            .teks6 {

                font-size: 20px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         LOADING
    ========================= -->

    <div class="loading" id="loading">

        <div class="loading-box">

            <div class="hati"></div>

            <div class="loading-text">
                LOADING MEMORIES
            </div>

            <div class="garis"></div>

        </div>

    </div>



    <!-- =========================
         HALAMAN UTAMA
    ========================= -->

    <div class="utama" id="utama">


        <!-- FOTO KECIL -->

        <img
            src="rinsss.jpeg"
            class="foto foto1"
            alt="Foto 1"
        >


        <img
            src="lutpiii.jpeg"
            class="foto foto2"
            alt="Foto 2"
        >


        <img
            src="kupleee.jpeg"
            class="foto foto3"
            alt="Foto 3"
        >



        <!-- FOTO BESAR DI TENGAH -->

        <img
            src="yy.jpeg"
            class="foto-tengah"
            alt="Foto utama"
        >



        <!-- =========================
             TULISAN
        ========================= -->

        <div class="teks teks1">
            always on my mind
        </div>


        <div class="teks teks2">
            stay with me
        </div>


        <div class="teks teks3">
            you are enough
        </div>


        <div class="teks teks4">
            only you
        </div>


        <div class="teks teks5">
            i miss you
        </div>


        <div class="teks teks6">
            you mean everything
        </div>


        <div class="teks teks7">
            my favorite person
        </div>


        <div class="teks teks8">
            i love you ❤️
        </div>


    </div>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        const loading =
            document.getElementById("loading");

        const utama =
            document.getElementById("utama");


        /*

            Tunggu 3 detik
            kemudian masuk ke halaman utama

        */

        setTimeout(function() {

            loading.classList.add("hilang");

            utama.classList.add("muncul");

            buatPartikel();

        }, 3000);



        /* =========================
           MEMBUAT PARTIKEL
        ========================= */

        function buatPartikel() {

            for (
                let i = 0;
                i < 35;
                i++
            ) {

                const partikel =
                    document.createElement("div");


                partikel.className =
                    "partikel";


                partikel.style.left =
                    Math.random() * 100 + "%";


                partikel.style.animationDelay =
                    Math.random() * 7 + "s";


                partikel.style.animationDuration =
                    5 + Math.random() * 7 + "s";


                const ukuran =
                    2 + Math.random() * 4;


                partikel.style.width =
                    ukuran + "px";


                partikel.style.height =
                    ukuran + "px";


                utama.appendChild(partikel);

            }

        }

    </script>


</body>

</html>
